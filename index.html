<!DOCTYPE html>
<html>
<head>
    <title>Staff Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Will be filled by JavaScript based on user role -->
    </div>

    <script>
        // Check if user is logged in
        const loggedInUser = localStorage.getItem('loggedInUser');
        
        if (!loggedInUser) {
            // Not logged in, go to login page
            window.location.href = 'login.html';
        }
        
        const user = JSON.parse(loggedInUser);
        
        let staff = [];
        let attendance = [];
        
        function loadData() {
            let savedStaff = localStorage.getItem('staff');
            let savedAttendance = localStorage.getItem('attendance');
            
            if (savedStaff) {
                staff = JSON.parse(savedStaff);
            }
            if (savedAttendance) {
                attendance = JSON.parse(savedAttendance);
            }
        }
        
        function saveData() {
            localStorage.setItem('staff', JSON.stringify(staff));
            localStorage.setItem('attendance', JSON.stringify(attendance));
        }
        
        function showDate() {
            let today = new Date();
            let dateString = today.getDate() + '/' + (today.getMonth()+1) + '/' + today.getFullYear();
            return dateString;
        }
        
        function logout() {
            localStorage.removeItem('loggedInUser');
            window.location.href = 'login.html';
        }
        
        function displayApp() {
            const app = document.getElementById('app');
            const todayDate = showDate();
            
            let html = `
                <div style="max-width: 800px; margin: 0 auto; padding: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #4CAF50; padding-bottom: 10px;">
                        <h1>📋 Staff Attendance System</h1>
                        <div>
                            <span>👤 ${user.name} (${user.role})</span>
                            <button onclick="logout()" style="margin-left: 10px; background-color: #f44336;">Logout</button>
                        </div>
                    </div>
                    
                    <h2>Today's Date: ${todayDate}</h2>
                    
                    <div id="staffList"></div>
                    
                    <button id="saveBtn" onclick="saveAttendance()">Save Today's Attendance</button>
                    
                    <br><br>
                    <a href="reports.html">View Reports</a>
            `;
            
            // Show Manage Staff link only for admin
            if (user.role === 'admin') {
                html += ` | <a href="staff.html">Manage Staff</a>`;
            }
            
            // Show warning for non-admin users
            if (user.role !== 'admin') {
                html += `<p style="color: orange; margin-top: 20px;">⚠️ You are in read-only mode for staff management. Contact admin to add or remove staff.</p>`;
            }
            
            html += `</div>`;
            app.innerHTML = html;
            
            // Load and display staff for attendance
            loadData();
            
            const container = document.getElementById('staffList');
            if (!container) return;
            
            let todayString = todayDate;
            let todayRecord = null;
            for (let i = 0; i < attendance.length; i++) {
                if (attendance[i].date === todayString) {
                    todayRecord = attendance[i];
                    break;
                }
            }
            
            if (staff.length === 0) {
                if (user.role === 'admin') {
                    container.innerHTML = '<p>No staff added yet. <a href="staff.html">Click here to add staff</a></p>';
                } else {
                    container.innerHTML = '<p>No staff has been added by admin yet.</p>';
                }
                return;
            }
            
            let html2 = '<h3>Mark Attendance</h3>';
            for (let i = 0; i < staff.length; i++) {
                let isChecked = false;
                if (todayRecord && todayRecord.records[staff[i].name]) {
                    isChecked = true;
                }
                html2 += '<div>';
                html2 += staff[i].name + ' (' + staff[i].role + ') ';
                
                // Teachers and admins can mark attendance, students cannot
                if (user.role === 'admin' || user.role === 'teacher') {
                    html2 += '<label>Present: <input type="checkbox" id="chk_' + i + '" ' + (isChecked ? 'checked' : '') + '></label>';
                } else {
                    // Students only see status, cannot change
                    html2 += '<span> Status: ' + (isChecked ? '✅ Present' : '❌ Absent') + '</span>';
                }
                html2 += '</div>';
            }
            container.innerHTML = html2;
        }
        
        function saveAttendance() {
            // Only admin and teachers can save attendance
            if (user.role !== 'admin' && user.role !== 'teacher') {
                alert('You do not have permission to save attendance!');
                return;
            }
            
            loadData();
            
            let today = new Date();
            let todayString = today.getDate() + '/' + (today.getMonth()+1) + '/' + today.getFullYear();
            
            let records = {};
            for (let i = 0; i < staff.length; i++) {
                let chk = document.getElementById('chk_' + i);
                if (chk) {
                    records[staff[i].name] = chk.checked;
                }
            }
            
            let found = false;
            for (let i = 0; i < attendance.length; i++) {
                if (attendance[i].date === todayString) {
                    attendance[i].records = records;
                    found = true;
                    break;
                }
            }
            
            if (!found) {
                attendance.push({
                    date: todayString,
                    records: records
                });
            }
            
            saveData();
            alert('Attendance saved!');
        }
        
        displayApp();
    </script>
</body>
</html>
